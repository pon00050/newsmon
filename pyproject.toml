[project]
name = "newsmon"
version = "0.2.0"
description = "Local news monitoring for foreign-news desks: licensed feed and wire collection, deduplication, rule-based ranking, search and a local queue; optional licence-gated AI assessment"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Newsmon contributors" }]
keywords = ["news monitoring", "rss", "newsroom", "deduplication", "korean", "multilingual"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# Versions follow research/architecture/build-vs-reuse-matrix.md.
# Packages marked "pin at build" there are pinned to the release resolved on 2026-11-25 (see uv.lock).
dependencies = [
    "pydantic==2.14.4",
    "python-dotenv==1.2.4",
    "pyyaml>=6.0.2",
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "courlan==1.5.0",
    "tldextract==5.4.0",
    "datasketch==2.0.0",
    "numpy==2.5.5",
    "defusedxml>=0.7.1",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "anthropic==2.14.0",
    "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://pon00050.github.io/newsmon/"
Source = "https://github.com/pon00050/newsmon"
Issues = "https://github.com/pon00050/newsmon/issues"

[project.scripts]
newsmon = "newsmon.cli:main"
newsmon-desktop = "newsmon.desktop:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]
# Static website build (scripts/build_site.py); not needed to run Newsmon.
site = [
    "markdown>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsmon"]
# Corpus-derived fixtures are private research data and are never shipped (TS-FIX-02).
exclude = ["tests/**", "tests/fixtures/**"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/fixtures/feeds/**", "tests/fixtures/gold/**", "data/**", ".venv/**", "_site/**", "_build/**"]

[tool.uv]
# Keep the venv on a short path (Windows MAX_PATH, P-009).
