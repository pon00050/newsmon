[pytest]
testpaths = tests
pythonpath = . src
addopts = -p no:cacheprovider --strict-markers
markers =
    unit: pure-function tests
    integration: one component against SQLite and/or the fixture server
    e2e: whole runs (smoke, O1 acceptance, workflows)
    arch: architecture fitness checks over the source tree
    eval: quality evaluation against gold sets
    live: real provider calls; run only with NEWSMON_LIVE=1
    slow: performance and kill-restart; nightly
    support: the test harness itself
    req(id): requirement id(s) this test proves (read by tools/req_coverage.py)
    corpus: needs the private corpus fixtures (tests/fixtures/feeds, gold); skipped where they are absent
    netguard_expected: the test deliberately triggers netguard (its own control)
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
