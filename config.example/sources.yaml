# Source registry (FR-01; spec 12 section 6). 27 public seed rows + 2 synthetic mock wire rows.
# Flags are the values of spec 12 section 6: a safety choice for unread terms, not a claim about any contract.
# The customer enters its own licensed sources at onboarding with that customer's terms (FR-30).
# Release A (P-011): http_api rows (fedreg_api, gdelt_lastupdate) load inactive until T-16 is built.
# Directory paths are relative to this config directory unless absolute.
# AI (Release A.1, P-013): only rows whose flags explicitly permit an op are ever sent to a hosted model. Public feeds
# keep permitted_ops: [] (unread terms; conservative). The SEC / Federal Register rows carry ai_processing: yes in
# spec 12 section 6 (SEC reuse VERIFIED; US federal works) and so list explicit ops here.
