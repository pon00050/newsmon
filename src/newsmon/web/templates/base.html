<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}newsmon{% endblock %} · newsmon</title>
<style>
  :root { --fg:#1d1f23; --muted:#667; --line:#dde1e6; --bg:#fff; --soft:#f5f7f9; --flash:#c62828; --report:#ef6c00; --review:#1565c0; --drop:#9e9e9e; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.45 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; gap:16px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--soft); flex-wrap:wrap; }
  header .brand { font-weight:700; }
  header nav a { margin-right:12px; color:var(--fg); text-decoration:none; }
  header nav a.on { font-weight:700; text-decoration:underline; }
  header .right { margin-left:auto; display:flex; gap:12px; align-items:center; }
  .ai { padding:2px 8px; border-radius:10px; background:#eceff1; color:#455a64; font-size:12px; }
  main { padding:12px 16px; max-width:1200px; }
  .msg { padding:6px 10px; background:#e8f5e9; border:1px solid #c8e6c9; margin-bottom:8px; }
  .warn { padding:6px 10px; background:#fff3e0; border:1px solid #ffe0b2; margin-bottom:8px; }
  form.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  tr.sel { background:#fffde7; outline:2px solid #fbc02d; }
  .band { display:inline-block; min-width:38px; text-align:center; padding:1px 6px; border-radius:4px; color:#fff; font-size:12px; }
  .band-flash { background:var(--flash); } .band-report { background:var(--report); } .band-review { background:var(--review); } .band-drop, .band-None { background:var(--drop); }
  .muted { color:var(--muted); font-size:12px; }
  .tag { display:inline-block; padding:0 5px; border:1px solid var(--line); border-radius:3px; font-size:11px; color:var(--muted); margin-left:4px; }
  .err { color:var(--flash); }
  .ok { color:#2e7d32; }
  a { color:#0d47a1; }
  button { cursor:pointer; }
  .ai-box { border:1px dashed #90a4ae; padding:8px; background:#fafafa; }
  .ai-box .label, .ai-line .label { font-size:11px; font-weight:700; color:#546e7a; }
  .ai-line { margin-top:2px; padding-left:6px; border-left:3px solid #90a4ae; }
  @media (max-width: 700px) { .hide-sm { display:none; } }
</style>
</head>
<body>
<header>
  <span class="brand">newsmon 외신 모니터</span>
  <nav>
    <a href="/" {% if request.url.path == '/' %}class="on"{% endif %}>큐</a>
    <a href="/search" {% if request.url.path == '/search' %}class="on"{% endif %}>검색</a>
    <a href="/sources" {% if request.url.path == '/sources' %}class="on"{% endif %}>소스 상태</a>
    <a href="/ai" {% if request.url.path == '/ai' %}class="on"{% endif %}>AI</a>
  </nav>
  <div class="right">
    {% if profile %}<span class="muted">프로필: {{ profile.name or profile.key }}</span>{% endif %}
    <a class="ai" id="ai-status" href="/ai">{{ ai_label }}</a>
    <form method="post" action="/refresh" style="margin:0">
      <button type="submit" {% if collecting %}disabled{% endif %}>{% if collecting %}수집 중…{% else %}지금 수집{% endif %}</button>
    </form>
  </div>
</header>
<main>
{% if collect_error %}<div class="warn">마지막 수집 실패: {{ collect_error }}</div>{% endif %}
{% for f, e in profile_errors.items() %}<div class="warn">프로필 {{ f }} 거부됨: {{ e }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
